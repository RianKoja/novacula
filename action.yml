name: Novacula
description: >-
  Score the theorems of a Lean 4 project with Novacula, keep their history on a branch, and
  draw a README badge and chart.
branding:
  icon: scissors
  color: blue

inputs:
  theorems:
    description: >-
      `all` for every user-written theorem of the module and its submodules, or a
      whitespace-separated list of declaration names ("title theorems").
    default: all
  module:
    description: Root module to score, e.g. `MscProofs`. Defaults to the package name in lake-manifest.json.
    default: ""
  corpus:
    description: >-
      Modules imported only to measure fame on. Defaults to `Mathlib` when the project depends on
      Mathlib, so fame does not depend on which part of Mathlib the project imports.
    default: auto
  branch:
    description: Branch that holds history.csv, history.svg and badge.svg.
    default: novacula
  push:
    description: >-
      `auto` pushes the history only for pushes, scheduled runs and manual runs on the default
      branch. `true` or `false` force it.
    default: auto
  nanoda-rev:
    description: nanoda_lib commit used for the second kernel check.
    default: 3a2407216ee84a75f9e1aead6803d0578be06ae7

outputs:
  cost:
    description: Cost of all selected theorems scored together (empty if the gate rejected them).
    value: ${{ steps.score.outputs.cost }}
  lean-version:
    description: Lean version the scores were computed on.
    value: ${{ steps.score.outputs.lean }}

runs:
  using: composite
  steps:
    - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
      with:
        build: true
        test: false
        lint: false

    - name: Build Novacula on the project's toolchain
      shell: bash
      run: |
        rm -rf "$RUNNER_TEMP/novacula"
        cp -r "$GITHUB_ACTION_PATH" "$RUNNER_TEMP/novacula"
        cp lean-toolchain "$RUNNER_TEMP/novacula/lean-toolchain"
        (cd "$RUNNER_TEMP/novacula" && lake build novacula)

    - name: Build lean4export
      shell: bash
      run: |
        ver=$(sed 's/.*:v//' lean-toolchain)
        tags=$(git ls-remote --tags https://github.com/leanprover/lean4export | sed 's|.*refs/tags/||')
        tag=""
        for t in "v$ver" "v${ver%.*}.0"; do
          if grep -qx "$t" <<<"$tags"; then tag=$t; break; fi
        done
        if [ -z "$tag" ]; then echo "::error::no lean4export tag for Lean $ver"; exit 1; fi
        git clone -q --depth 1 -b "$tag" https://github.com/leanprover/lean4export "$RUNNER_TEMP/lean4export"
        cp lean-toolchain "$RUNNER_TEMP/lean4export/"
        (cd "$RUNNER_TEMP/lean4export" && lake build)

    # Only the binary is cached, in its own directory: restoring into the source checkout would
    # leave a directory without `.git` that the next clone refuses.
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      id: nanoda-cache
      with:
        path: ${{ runner.temp }}/nanoda-bin
        key: nanoda-bin-${{ runner.os }}-${{ inputs.nanoda-rev }}

    - name: Build nanoda
      if: steps.nanoda-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        rm -rf "$RUNNER_TEMP/nanoda_lib"
        git clone -q https://github.com/ammkrn/nanoda_lib "$RUNNER_TEMP/nanoda_lib"
        git -C "$RUNNER_TEMP/nanoda_lib" checkout -q "${{ inputs.nanoda-rev }}"
        cargo build -q --release --manifest-path "$RUNNER_TEMP/nanoda_lib/Cargo.toml"
        mkdir -p "$RUNNER_TEMP/nanoda-bin"
        cp "$RUNNER_TEMP/nanoda_lib/target/release/nanoda_bin" "$RUNNER_TEMP/nanoda-bin/"

    # Raw metrics depend only on the Lean version and each module's olean, so they are reused
    # across runs; costs are always recomputed from them.
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: .lake/novacula-cache
        key: novacula-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
        restore-keys: novacula-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

    - name: Score
      id: score
      shell: bash
      env:
        THEOREMS: ${{ inputs.theorems }}
        MODULE: ${{ inputs.module }}
        CORPUS: ${{ inputs.corpus }}
      run: |
        mod=${MODULE:-$(jq -r .name lake-manifest.json)}
        if [ "$CORPUS" = auto ]; then
          CORPUS=$(jq -r 'if any(.packages[]; .name == "mathlib") then "Mathlib" else "" end' lake-manifest.json)
        fi
        targets="$RUNNER_TEMP/novacula-targets.txt"
        if [ "$THEOREMS" = all ]; then
          echo "$mod *" > "$targets"
        else
          for t in $THEOREMS; do echo "$mod $t"; done > "$targets"
        fi
        nov="$RUNNER_TEMP/novacula"
        export NOVACULA_CORPUS="$CORPUS" LEAN4CHECKER=leanchecker NANODA="$nov/scripts/nanoda-check"
        export LEAN4EXPORT="$RUNNER_TEMP/lean4export/.lake/build/bin/lean4export"
        export NANODA_BIN="$RUNNER_TEMP/nanoda-bin/nanoda_bin"
        # The release version in lakefile.toml, so a workflow pinned to a commit SHA still records
        # which release it ran.
        rev=v$(sed -n 's/^version = "\(.*\)"/\1/p' "$GITHUB_ACTION_PATH/lakefile.toml")
        # The tool never reads a clock: the date is passed in.
        lake env "$nov/.lake/build/bin/novacula" csv "$(date -u +%F)" "$rev" "$targets" > "$RUNNER_TEMP/novacula-rows.csv"
        lean=$(tail -n 1 "$RUNNER_TEMP/novacula-rows.csv" | cut -d, -f12)
        cost=$(awk -F, 'END { print $13 }' "$RUNNER_TEMP/novacula-rows.csv")
        echo "cost=$cost" >> "$GITHUB_OUTPUT"
        echo "lean=$lean" >> "$GITHUB_OUTPUT"
        {
          echo "### Novacula on Lean $lean"
          echo
          echo "| declaration | gate | cost |"
          echo "|---|---|---:|"
          awk -F, '{ printf "| `%s` | %s | %s |\n", $4, ($5 == "true" ? "pass" : "rejected"), $13 }' "$RUNNER_TEMP/novacula-rows.csv"
          echo
          echo "Corpus for fame: ${CORPUS:-none}. Lower cost means easier to understand fully."
        } >> "$GITHUB_STEP_SUMMARY"
        # Unchecked proofs are rejected, never scored.
        if awk -F, '$5 != "true" { bad = 1 } END { exit !bad }' "$RUNNER_TEMP/novacula-rows.csv"; then
          echo "::error::the correctness gate rejected some declarations, see the job summary"
          exit 1
        fi

    - name: Update history, chart and badge
      shell: bash
      env:
        BRANCH: ${{ inputs.branch }}
        PUSH: ${{ inputs.push }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        # Only the default branch publishes, so a manual run on a feature branch cannot put its
        # scores in the history, and every publishing run shares one concurrency group per ref.
        if [ "$PUSH" = auto ]; then
          PUSH=false
          case "$GITHUB_EVENT_NAME" in
            push|schedule|workflow_dispatch)
              [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ] && PUSH=true ;;
          esac
        fi
        hist="$RUNNER_TEMP/novacula-history"
        nov="$RUNNER_TEMP/novacula/.lake/build/bin/novacula"
        rows="$RUNNER_TEMP/novacula-rows.csv"
        today=$(cut -d, -f1 "$rows" | head -n 1)
        # Rebuild the history from the branch tip. Called again after a rejected push, so a
        # concurrent run's rows are kept and only this day's rows are replaced.
        update() {
          git worktree remove --force "$hist" 2>/dev/null || rm -rf "$hist"
          git worktree prune
          git branch -q -D novacula-orphan 2>/dev/null || true
          if git fetch -q origin "$BRANCH" 2>/dev/null; then
            git worktree add -q --detach "$hist" FETCH_HEAD
          else
            git worktree add -q --detach "$hist"
            git -C "$hist" checkout -q --orphan novacula-orphan
            git -C "$hist" rm -rfq --ignore-unmatch .
          fi
          cd "$hist"
          [ -s history.csv ] || "$nov" csv-header > history.csv
          # One run per day: a later run replaces the day's rows.
          grep -v "^$today," history.csv > history.tmp || true
          cat "$rows" >> history.tmp
          mv history.tmp history.csv
          "$nov" chart history.csv history.svg cost
          "$nov" badge history.csv badge.svg
          git add history.csv history.svg badge.svg
          git diff --cached --quiet || git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "novacula: $today on Lean ${{ steps.score.outputs.lean }} for ${GITHUB_SHA::7}"
          cd "$GITHUB_WORKSPACE"
        }
        update
        if [ "$PUSH" != true ]; then echo "not pushing ($GITHUB_EVENT_NAME on $GITHUB_REF_NAME)"; exit 0; fi
        for attempt in 1 2 3 4 5; do
          if git -C "$hist" push -q origin "HEAD:refs/heads/$BRANCH"; then exit 0; fi
          echo "push rejected (attempt $attempt), refetching $BRANCH and retrying"
          sleep $((attempt * 5))
          update
        done
        echo "::error::could not push to $BRANCH after 5 attempts"
        exit 1
